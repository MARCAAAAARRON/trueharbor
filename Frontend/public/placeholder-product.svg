<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004aad" />
      <stop offset="100%" stop-color="#002459" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Subtle Coastal Compass Rose Grid Pattern in Background -->
  <circle cx="300" cy="270" r="160" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="300" cy="270" r="110" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.4" />

  <!-- Center Floating Card -->
  <rect x="220" y="190" width="160" height="160" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Stylized Camera / Lens / Nautical Crest Icon -->
  <g transform="translate(260, 230)" fill="none" stroke="url(#iconGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Camera Body -->
    <path d="M 12 18 L 22 8 L 58 8 L 68 18 L 76 18 C 80.4 18 84 21.6 84 26 L 84 66 C 84 70.4 80.4 74 76 74 L 4 74 C -0.4 74 -4 70.4 -4 66 L -4 26 C -4 21.6 -0.4 18 4 18 Z" stroke="#004aad" stroke-width="3.5" />
    <!-- Center Lens -->
    <circle cx="40" cy="46" r="18" stroke="#002459" stroke-width="3.5" />
    <circle cx="40" cy="46" r="8" fill="#004aad" opacity="0.2" stroke="none" />
    <!-- Flash / Dot -->
    <circle cx="68" cy="28" r="3" fill="#ffc247" stroke="none" />
  </g>

  <!-- Label Typography -->
  <text x="300" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#002459" text-anchor="middle" letter-spacing="0.5">
    Authentic Provision
  </text>
  <text x="300" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">
    Photo Awaiting Upload
  </text>
</svg>
